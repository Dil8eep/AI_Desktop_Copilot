[project]
name = "ai-desktop-copilot-backend"
version = "0.1.0"
description = "Provider-neutral streaming backend for AI Desktop Copilot"
requires-python = ">=3.12,<3.15"
dependencies = [
  "asyncpg>=0.30,<1.0",
  "bcrypt>=4.2,<5.0",
  "cryptography>=45,<47",
  "email-validator>=2.2,<3.0",
  "PyJWT>=2.10,<3.0",
  "fastapi>=0.115,<1.0",
  "groq>=1.0,<2.0",
  "pydantic-settings>=2.8,<3.0",
  "PyAudioWPatch>=0.2.12.7,<1.0; sys_platform == 'win32'",
  "numpy>=2.0,<3.0",
  "liteparse>=2.10,<3.0",
  "openai>=1.0,<3.0",
  "ollama>=0.6,<1.0",
  "pypdf>=5.0,<6.0",
  "python-multipart>=0.0.20,<1.0",
  "silero-vad>=5.1,<6.0",
  "uvicorn[standard]>=0.34,<1.0",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.15,<2.0",
  "pyinstaller>=6.0,<7.0",
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests"]

[tool.uv]
package = false
