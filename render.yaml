services:
  - type: web
    name: ai-desktop-copilot-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: .venv/bin/python -m app.database_cli migrate && .venv/bin/python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips=*
    healthCheckPath: /health/ready
    autoDeployTrigger: commit
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: COPILOT_ENVIRONMENT
        value: production
      - key: COPILOT_FORCE_HTTPS
        value: "true"
      - key: COPILOT_CONSOLE_TRANSCRIPT_LOGGING
        value: "false"
      - key: COPILOT_DATABASE_URL
        sync: false
      - key: COPILOT_JWT_SECRET
        sync: false
      - key: COPILOT_LOCAL_AUTH_TOKEN
        sync: false
      - key: COPILOT_CREDENTIAL_MASTER_KEY
        sync: false
      - key: COPILOT_BOOTSTRAP_ADMIN_EMAIL
        sync: false
      - key: COPILOT_CORS_ORIGINS
        sync: false
      - key: COPILOT_ALLOWED_HOSTS
        sync: false
